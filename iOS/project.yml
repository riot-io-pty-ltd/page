name: Page
options:
  bundleIdPrefix: app.page
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  groupSortPosition: top
  createIntermediateGroups: true

# Per-developer settings (team id, bundle id, push entitlements) come from
# Config/Local.xcconfig via Config/Page.xcconfig. See README.md.
configFiles:
  Debug: Config/Page.xcconfig
  Release: Config/Page.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Bump these to version a build; Info.plist reads them.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  Page:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Page
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PAGE_BUNDLE_ID)
        INFOPLIST_FILE: Page/Info.plist
        CODE_SIGN_ENTITLEMENTS: $(PAGE_ENTITLEMENTS)
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        # Simulator builds stay unsigned so they work without any Apple
        # account; device builds sign with DEVELOPMENT_TEAM from Local.xcconfig.
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"
        "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": "NO"
    dependencies:
      - target: PageWidget

  # Home Screen / Lock Screen widget: reads GET /status with the relay
  # credentials the app shares through a Keychain access group.
  PageWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PageWidget
      - path: Page/Models
      - path: Page/Design/Theme.swift
      - path: Page/Design/UsageRing.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PAGE_BUNDLE_ID).widget
        INFOPLIST_FILE: PageWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: PageWidget/PageWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"
        "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": "NO"
