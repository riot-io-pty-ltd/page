name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-build:
    name: swift build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Build (debug)
        run: swift build -c debug
      - name: Build (release)
        run: swift build -c release
      - name: Unit tests
        # Pure logic + fakes only. The live injection test skips itself
        # unless PAGE_LIVE_SESSION_ID is set.
        run: swift test

  ios-build:
    name: iOS build (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Install Metal toolchain
        # The iOS target compiles Metal shaders (the Mac app embeds a prebuilt blob, so `swift build` doesn't).
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Regenerate project
        working-directory: iOS
        run: xcodegen generate
      - name: Build iOS app
        working-directory: iOS
        run: |
          xcodebuild \
            -project Page.xcodeproj \
            -scheme Page \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Logic tests
        working-directory: iOS
        run: bash Tests/run-logic-tests.sh

  worker-typecheck:
    name: Worker typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Tests run the TypeScript sources through Node's type stripping
          # (package.json engines: >=22.18).
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Cloudflare/package-lock.json
      - name: Install deps
        working-directory: Cloudflare
        run: npm ci
      - name: Type-check
        working-directory: Cloudflare
        run: npx tsc --noEmit
      - name: Tests
        working-directory: Cloudflare
        run: npm test

  scripts:
    name: Shell + Python syntax
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: bash -n (macOS bash 3.2)
        run: |
          bash -n hooks/page-notify.sh
          bash -n install.sh
          bash -n build.sh
      - name: Python compile
        run: python3 -m py_compile hooks/page-extract-context.py
